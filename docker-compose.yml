name: pizzasales

services:
  db:
    image: postgres:18.6-alpine
    container_name: pizzasales-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pizzasales}
      POSTGRES_USER: ${DB_USERNAME:-pizzasalesuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pizzasalespw}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pizzasales-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pizzasalesuser} -d ${DB_NAME:-pizzasales}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pizzasales-db-data:

spring:
  application:
    name: pizzasalesapi
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pizzasales}
    username: ${DB_USERNAME:pizzasalesuser}
    password: ${DB_PASSWORD:pizzasalespw}
  flyway:
    enabled: false # migrations run as a separate CI/CD step, not on app startup (see README)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

app:
  import:
    pizza-types-file: classpath:data/pizza_types.csv
    pizzas-file: classpath:data/pizzas.csv

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
    db:
      enabled: true

springdoc:
  show-actuator: true

spring:
  application:
    name: pizzasalesapi
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pizzasales}
    username: ${DB_USERNAME:pizzasalesuser}
    password: ${DB_PASSWORD:pizzasalespw}
  flyway:
    enabled: false # migrations run as a separate CI/CD step, not on app startup (see README)
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error bodies for framework errors (bad path variable, unknown route, ...)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

app:
  import:
    chunk-size: 1000
    pizzas:
      types-file: classpath:data/pizza_types.csv
      file: classpath:data/pizzas.csv
    orders:
      file: classpath:data/orders.csv
      details-file: classpath:data/order_details.csv

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
    db:
      enabled: true

springdoc:
  show-actuator: true
  default-produces-media-type: application/json # instead of */* for responses without an explicit media type

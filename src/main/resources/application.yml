spring:
  application:
    name: pizzasalesapi
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pizzasales}
    username: ${DB_USERNAME:pizzasalesuser}
    password: ${DB_PASSWORD:pizzasalespw}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
      probes:
        enabled: false
  health:
    defaults:
      enabled: false
    db:
      enabled: true

springdoc:
  show-actuator: true

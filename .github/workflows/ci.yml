name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push to the same branch or PR cancels the run still in progress for it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Surefire: unit and web slice tests, no Docker or database
      - name: Run unit tests
        run: ./mvnw -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Failsafe: *IT classes against Postgres in Testcontainers (Docker is preinstalled on the runner);
      # unit tests are skipped here because the unit job runs them
      - name: Run integration tests
        run: ./mvnw -B verify -DskipUnitTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports
